<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Owner Sign In — JELIX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#142a39,#080e14 65%);font:15px system-ui;color:#eaf3fa}.panel{width:min(420px,calc(100% - 36px));background:#111d28;border:1px solid #284252;border-radius:20px;padding:36px;box-shadow:0 22px 70px #0007}.brand{letter-spacing:.22em;color:#7ed4ff;font-size:24px;font-weight:800}.sub{color:#8ca4b3;font-size:12px;letter-spacing:.17em;margin:8px 0 30px}label{display:block;margin:17px 0 8px;color:#c8d8e2}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #3c586b;background:#0a141d;color:white;font:inherit}button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:9px;background:#55bdf5;color:#06101a;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#message{min-height:24px;color:#ff9f9f;margin-top:15px}.back{display:block;margin-top:18px;color:#93afc0;text-decoration:none;text-align:center}</style></head><body><main class="panel"><div class="brand">JELIX</div><div class="sub">OWNER HQ / SECURE SIGN IN</div><h1>Welcome back.</h1><p>Sign in to manage your platform.</p><form id="form"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in to Owner HQ</button><div id="message" role="alert"></div></form><a class="back" href="/">← Return to JELIX</a></main><script src="/owner-login.js" defer></script></body></html>
